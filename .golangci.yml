version: "2"

run:
  # Lint the //go:build integration files too (real-sshd and E2E tests);
  # they compile without sshd, so the gate costs nothing extra.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unused
    - wrapcheck
  settings:
    errcheck:
      # Writing to stdout/stderr rarely warrants error handling in a CLI.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 15
    wrapcheck:
      # sshconn is connection glue extracted verbatim from sshread (2026-07-19
      # apply spec): its errors already carry full call-site context ("dial
      # host:port", "remote read on addr"), and the delegating packages must
      # return them untouched — double-wrapping would change operator-facing
      # error text the extraction promised to preserve.
      ignore-package-globs:
        - github.com/javadh75/SSHepherd/internal/sshconn
    forbidigo:
      # Machine-enforce the transport invariant: host keys are verified strictly
      # against known_hosts (x/crypto/ssh/knownhosts) — no TOFU, no bypass.
      analyze-types: true
      forbid:
        - pattern: ^ssh\.InsecureIgnoreHostKey$
          pkg: ^golang\.org/x/crypto/ssh$
          msg: host-key checking must stay strict (knownhosts callback only)
        - pattern: ^ssh\.FixedHostKey$
          pkg: ^golang\.org/x/crypto/ssh$
          msg: host-key checking must stay strict (knownhosts callback only)
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: crypto/md5
              desc: weak hash; prefer crypto/sha256
            - pkg: crypto/sha1
              desc: weak hash; prefer crypto/sha256
        # Non-test code only: tests legitimately drive the binary and ssh-keygen.
        non-test:
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: os/exec
              desc: native golang.org/x/crypto/ssh only — never shell out to a host ssh binary
            - pkg: math/rand
              desc: not cryptographically secure; use crypto/rand
  exclusions:
    generated: lax
    rules:
      # Tests get more slack: table dupes, unwrapped assertion errors, etc.
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocyclo
          - wrapcheck
      # gosec is not in `enable` above: `make gosec` runs it here with
      # `--enable-only=gosec`, for the //go:build integration test files
      # only (standalone gosec skips every _test.go file; it covers the
      # non-test code). Unit test files stay out of scope.
      - path-except: '(integration|e2e)_test\.go$'
        linters:
          - gosec
      # Triaged gosec false positives in the integration files, pinned to
      # the exact source line so a new hit in the same file still fails.
      # The harness hands the tests their inputs (SSHEPHERD_IT_* env vars,
      # t.TempDir paths) and they run the freshly built binary.
      - path: '(^|/)(cmd/sshepherd/e2e|internal/sshwrite/integration)_test\.go$'
        linters:
          - gosec
        text: G703
        source: 'os\.ReadFile\(os\.Getenv\("SSHEPHERD_IT_PUB"\)\)'
      - path: '(^|/)cmd/sshepherd/e2e_test\.go$'
        linters:
          - gosec
        text: G204
        source: 'exec\.CommandContext\(t\.Context\(\), "go", "build", "-o", bin, "\."\)'
      - path: '(^|/)cmd/sshepherd/e2e_test\.go$'
        linters:
          - gosec
        text: G204|G702
        source: '^\s*cmd := exec\.CommandContext\(t\.Context\(\), bin, args\.\.\.\)$'
      - path: '(^|/)cmd/sshepherd/e2e_test\.go$'
        linters:
          - gosec
        text: G304
        source: 'os\.ReadFile\(adopted\)'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/javadh75/SSHepherd
