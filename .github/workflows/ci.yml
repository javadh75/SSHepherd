name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Daily: catch CVEs disclosed against pinned deps (govulncheck) and let the
  # fuzzer explore new inputs, even when the repo is quiet; Trivy-scan the
  # published `latest` image for CVEs disclosed after its release.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); every container image by digest. Dependabot bumps both.

jobs:
  go:
    name: Go checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck's stdlib verdict is only about the shipped binary when CI,
      # go.mod and the image build stage name the same Go patch release.
      - name: Go toolchain matches the image build stage
        run: |
          mod=$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          img=$(sed -n 's/^FROM .*golang:\([0-9.]*\)-alpine@.*/\1/p' Dockerfile)
          pin=$(sed -n 's/^GO_PIN *:= *go//p' Makefile)
          act=$(go env GOVERSION)
          if [ -z "$mod" ] || [ "$mod" != "$img" ] || [ "$mod" != "$pin" ] || [ "go$mod" != "$act" ]; then
            echo "::error::go.mod says go $mod, Dockerfile builds with golang:$img, Makefile GO_PIN is go$pin, CI runs $act; bump all of them together"
            exit 1
          fi

      - name: Install pinned tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The single gate local and CI share: tidy (fails on a go.mod/go.sum
      # diff), fmt, vet, lint, deadcode, security, and the race suite with the
      # coverage minimum. The suite runs exactly once.
      - name: Quality gate
        run: make check

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          if-no-files-found: warn
          path: |
            coverage.out
            coverage.html

  # Built and gated natively on both architectures the release ships (the
  # pinned Trivy and dockle digests are multi-arch indexes).
  docker:
    name: Docker image (${{ matrix.arch }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: sshepherd:ci
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile lints are arch-independent: run them once.
      - name: Lint Dockerfile (hadolint)
        if: matrix.arch == 'amd64'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint Dockerfile config (Trivy)
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" \
            config --exit-code 1 .

      - name: Build image
        run: docker build --build-arg "VERSION=${GITHUB_SHA::12}" -t "$IMAGE" .

      - name: Scan image for CVEs (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$IMAGE"

      - name: Lint image (dockle)
        # CIS-DI-0006 (HEALTHCHECK) waived: sshepherd is a CLI, not a service.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$DOCKLE_IMAGE" --exit-code 1 -i CIS-DI-0006 "$IMAGE"

      # ELF arch, --version / --help smoke, < 30 MB size budget, non-root
      # user, PID-1 SIGTERM — the same script `make smoke` runs locally.
      - name: Smoke, arch, size, user and signal gates
        run: ./scripts/docker-gates.sh

  integration:
    name: Integration (sshd container)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make integration

  # Required checks name only this job, so renaming or splitting a job above
  # never strands a branch/tag rule on a check that no longer exists.
  ci-ok:
    name: ci-ok
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [go, docker, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "::error::a required job ended $r"; exit 1; fi
          done

  scheduled:
    name: Scheduled (govulncheck + fuzz)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vulnerability scan (govulncheck)
        run: make vuln

      # -k: run every fuzz target even after one fails, so a single run
      # surfaces all crashers.
      - name: Fuzz all parsers
        run: make -k fuzz

      # A failing fuzz target writes its minimized input to the package's
      # testdata/fuzz/<Target>/ — collect only the new (untracked) ones.
      - name: Collect new fuzz crashers
        if: failure()
        run: |
          mkdir -p fuzz-crashers
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' |
            while read -r f; do
              mkdir -p "fuzz-crashers/$(dirname "$f")"
              cp "$f" "fuzz-crashers/$f"
            done

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: fuzz-crashers/
          if-no-files-found: ignore

  # Its own job, so a standing CVE in a published image never turns the
  # fuzz job red (or hides a new crasher behind the same red X).
  published-image-scan:
    name: Published image CVEs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CVEs disclosed after a release (distroless or the Go stdlib) must page
      # for images users already run, not wait for the next tag.
      - name: Scan the published image (Trivy)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # "Not published yet" is decided from the repo's vX.Y.Z tags, never
        # from a registry error: once a release tag exists, any inspect
        # failure (auth, outage, a missing :latest) fails the job.
        run: |
          set -euo pipefail
          REF=ghcr.io/javadh75/sshepherd:latest
          # Its own assignment, so a failed listing fails the job; and grep
          # without -q reads all input, so no SIGPIPE turns a match into "none".
          tags=$(git ls-remote --tags --refs origin 'refs/tags/v*')
          if ! printf '%s\n' "$tags" | cut -f2 |
               grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null; then
            echo "::notice::no vX.Y.Z release tag yet; nothing to scan"
            exit 0
          fi
          if ! docker buildx imagetools inspect "$REF" >/dev/null; then
            echo "::error::cannot read $REF although a release tag exists; the published image was not scanned"
            exit 1
          fi
          for p in linux/amd64 linux/arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
              --image-src remote --platform "$p" \
              --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$REF"
          done
