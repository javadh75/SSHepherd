name: Release image

# Tag-triggered: build the multi-arch image, gate it, push it to GHCR with an
# SBOM + build provenance attached, and sign it keyless with cosign (Sigstore
# OIDC — no long-lived signing key exists anywhere).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment). Dependabot bumps them.

jobs:
  image:
    name: Build, attest and sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Gate the exact Dockerfile before anything is pushed: native-arch build,
      # then the same --version/--help, size and non-root checks CI runs.
      - name: Build gate image (native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sshepherd:release-gate
          build-args: VERSION=${{ env.VERSION }}

      - name: Smoke, size and user gates
        env:
          IMAGE: sshepherd:release-gate
        run: ./scripts/docker-gates.sh

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the name, as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          # BuildKit SBOM + max-mode provenance attestations attached to the image.
          sbom: true
          provenance: mode=max

      - name: Sign image (cosign keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Sign by digest — never by a mutable tag. One repository, so every
          # tag resolves to the same name@digest.
          ref="$(printf '%s\n' "$TAGS" | head -n1)"
          cosign sign --yes "${ref%:*}@${DIGEST}"
